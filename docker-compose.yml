services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: varzesha
      POSTGRES_PASSWORD: varzesha_dev
      POSTGRES_DB: varzesha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varzesha -d varzesha"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
